<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Sidebar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<style>/* Basic styles */
    body {
        margin: 0;
        font-family: Arial, sans-serif;
    }
    
    /* Hide navbar and sidebar by default */
    .navbar,
    .sidebar {
        display: none;
    }
    
    /* Show navbar and sidebar only on mobile screens */
    @media (max-width: 768px) {
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #1c1c1c;
            color: #f6f6f9;
        }
    
        .navbar-logo img {
            height: 30px;
        }
    
        .menu-icon {
            font-size: 24px;
            cursor: pointer;
        }
    
        .sidebar {
            position: fixed;
            top: 0;
            left: -100%;
            height: 100%;
            width: 100%;
            background-color: #f6f6f9;
            transition: left 0.3s ease;
            z-index: 1000;
            display: block;
        }
    
        .sidebar.show {
            left: 0;
        }
    
        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background-color: #f6f6f9;
        }
    
        .sidebar-header .logo img {
            height: 30px;
        }
    
        .sidebar-header .close-btn {
            font-size: 24px;
            cursor: pointer;
        }
    
        .menu-items {
            list-style: none;
            padding: 0;
            margin: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
        }
    
        .menu-items li {
            padding: 20px;
        }
    
        .menu-items li a {
            text-decoration: none;
            color: #1c1c1c;
            font-size: 18px;
            display: block;
        }
    }
    </style>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-logo">
            <img id="logo-mbl" src="Logos-02.png" alt="Logo">
        </div>
        <div class="menu-icon" onclick="toggleSidebar()">☰</div>
    </nav>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <img id="logo-mbl" src="Logos-02.png" alt="Logo">
            </div>
            <div class="close-btn" onclick="toggleSidebar()">✖</div>
        </div>
        <ul class="menu-items">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </div>

    <script src="script.js">function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('show');
    }
    </script>
</body>
</html>
